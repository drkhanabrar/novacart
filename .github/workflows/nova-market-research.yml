name: NovaCart AI — Weekly Market Research

on:
  schedule:
    # Weekly, Monday 03:00 UTC (08:30 IST). Research makes live calls to
    # Trends, Reddit, News and CJ for every seed, and a daily candidate set
    # would produce a review queue nobody can keep up with.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many candidates to evaluate"
        required: false
        default: "40"
        type: string
      seedOffset:
        description: "Seed index to start from (blank = weekly rotation)"
        required: false
        default: ""
        type: string

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # ---------------------------------------------------------------------
      # Diagnose the secrets before spending two minutes on a doomed run.
      #
      # DATABASE_URL has now failed three times with three different symptoms
      # (host "base", then "Invalid URL"), so this prints the SHAPE of the
      # value — length, first and last characters, whether it contains a
      # newline — without ever revealing the password. Guessing at what got
      # pasted has cost several cycles; this ends it.
      # ---------------------------------------------------------------------
      - name: Diagnose configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          node <<'SCRIPT'
          const u = process.env.DATABASE_URL || "";

          console.log("=== DATABASE_URL shape ===");
          console.log("length:", u.length, "(local value is 141)");
          console.log("first 22:", JSON.stringify(u.slice(0, 22)));
          console.log("last 22:", JSON.stringify(u.slice(-22)));
          console.log("contains newline:", /[\r\n]/.test(u));
          console.log("contains quote:", u.includes('"') || u.includes("'"));
          console.log("starts correctly:", u.startsWith("postgresql://"));

          console.log("");
          console.log("=== API keys ===");
          for (const name of [
            "CJ_API_KEY",
            "OPENROUTER_API_KEY",
            "GEMINI_API_KEY",
            "TAVILY_API_KEY",
          ]) {
            const v = process.env[name] || "";
            console.log(name + ":", v ? "set (" + v.length + " chars)" : "MISSING");
          }

          console.log("");
          if (!u) {
            console.error("FATAL: DATABASE_URL secret is not set at all.");
            process.exit(1);
          }
          try {
            const host = new URL(u).hostname;
            if (!host.includes(".")) {
              console.error('FATAL: host is "' + host + '" — the secret is truncated.');
              process.exit(1);
            }
            console.log("Database host OK:", host);
          } catch (error) {
            console.error("FATAL: DATABASE_URL will not parse as a URL.");
            console.error("Compare the shape above against your local value.");
            console.error("It must begin with postgresql:// and contain no quotes or newline.");
            process.exit(1);
          }

          if (!process.env.OPENROUTER_API_KEY && !process.env.GEMINI_API_KEY) {
            console.error("");
            console.error("FATAL: no AI provider key configured.");
            console.error("Every candidate would fall back to the deterministic analyst,");
            console.error("which returns fixed constants (repeat 35, return risk 25).");
            console.error("Those look like findings but measure nothing. Refusing to run.");
            process.exit(1);
          }
          SCRIPT

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate

      - name: Run NOVA research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}

          # ANTHROPIC_API_KEY is deliberately NOT passed. With paid fallback
          # disabled it would never be used, and withholding it from the job
          # removes any possibility of accidental spend.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

          # Gemini leads. OpenRouter's free pool rate-limits daily, which is
          # what pushed earlier runs into the rules fallback.
          NOVA_AI_PROVIDER: gemini
          NOVA_FREE_AI_ORDER: gemini,openrouter,huggingface
          NOVA_GEMINI_MODEL: gemini-3.6-flash
          NOVA_AI_TIMEOUT_MS: 90000
          NOVA_MAX_AI_ANALYSES: 12
          NOVA_ALLOW_PAID_AI_FALLBACK: "false"

          NOVA_MARKET_REGION: IN
          NOVA_SEED_OFFSET: ${{ github.event.inputs.seedOffset || '' }}
          NOVA_SEEDS_PER_RUN: 18

          NOVA_MAX_CANDIDATES: 40
          NOVA_MIN_DEMAND_SCORE: 55
          NOVA_MIN_MARGIN_PERCENT: 22
          NOVA_SHIPPING_BUFFER_INR: 120
          NOVA_PAYMENT_FEE_PERCENT: 2
          NOVA_DROPSHIP_STOCK: 100

          NOVA_ENABLE_PUBLIC_YOUTUBE: true
          NOVA_ENABLE_AMAZON_SNAPSHOT: true
          NOVA_RESEARCH_TIMEOUT_MS: 12000

        # Research NEVER publishes. Candidates queue at /admin/candidates and
        # wait for a human decision.
        run: npm run research:market -- --limit=${{ github.event.inputs.limit || '40' }}